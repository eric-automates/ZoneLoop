<script>
'use strict';
/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §1 CONFIG                                                              ║
   ║ PURPOSE : Every tunable constant lives here.                           ║
   ║ IN/OUT  : none / CFG object (read-only by convention)                  ║
   ║ NOTES   : Units are in the key name or the trailing comment.           ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
const CFG = {
  APP: 'ZoneLoop', VER: '0.1.0', STORE_KEY: 'zoneloop.cfg',
  SCAN_S: 5,            // s   LVCS/MCS control scan period
  PV_ALPHA: 0.3,        // -   room-temp input filter (EMA weight)
  AIR_DT: 8,            // °F  |supply − room| above this ⇒ HVAC is blowing
  POS_DB: 1.5,          // %   servo deadband: ignore smaller moves (saves wear)
  FF_MAX: 20,           // %   clamp on decoupling feed-forward
  MIN_AVG_OPEN: 40,     // %   SAFETY: min average opening of managed vents
  PAH_INWC: 0.62,       // inH2O  static-pressure high alarm
  PID: { kc: 15, ti: 1200, td: 0 },          // %/°F, s, s
  ALM: { zdev: 8, zScans: 12, flowLo: 25, fScans: 12, tDev: 3, tScans: 360, comm: 3 },
  HIST: { excmax: 600, compmax: 3600, arcCap: 4000, rawCap: 720 },   // s, s, events
  SIM: { FLOW_REF_CFM: 120, LEAK: 0.08, G_OTHER: 400, FAN_QMAX: 1200, INWC: 0.7,
         SLEW: 2.5,     // %/s servo travel (slow on purpose)
         STALL: 9,      // %   flow wheel stalls below this ⇒ reads 0
         T_HEAT: 115, T_COOL: 55, DUCT_TAU: 120 },
  TEST: { base: 50, settleAll: 18, settle: 15, back: 6, avg: 3 },    // scans
};

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §2 UTIL                                                                ║
   ║ PURPOSE : Small pure helpers shared by all sections.                   ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
// clamp: limit x to [a,b] → number
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
// gauss: normally distributed noise with std dev s → number
const gauss = s => s * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(6.2832 * Math.random());
// esc: make text safe for innerHTML → string
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// fx: fixed decimals, dash when missing → string
const fx = (x, d = 1) => (x == null || isNaN(x)) ? '—' : Number(x).toFixed(d);
// hhmm: epoch seconds → local clock text
const hhmm = (t, sec) => { const d = new Date(t * 1000), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + (sec ? ':' + p(d.getSeconds()) : ''); };
// randId: n random chars from an unambiguous alphabet → string
const randId = n => { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < n; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
// randHex: n random bytes as hex (uses crypto when present) → string
const randHex = n => { const b = new Uint8Array(n); if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(b); else for (let i = 0; i < n; i++) b[i] = Math.random() * 256; return Array.from(b, x => x.toString(16).padStart(2, '0')).join(''); };

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §3 HISTORIAN                                                           ║
   ║ PURPOSE : Tag database + time-series archive, PI-style.                ║
   ║ IN      : write(tag, t, value) once per scan for every tag.            ║
   ║ OUT     : series(tag,t0,t1) → [[t,v]…]; point attributes; counters.    ║
   ║ NOTES   : Pipeline is raw → EXCEPTION test → COMPRESSION → archive.    ║
   ║           Exception = deadband on the snapshot (ExcDev/ExcMax).        ║
   ║           Compression = swinging door (CompDev/CompMax).               ║
   ║           Archive is in RAM only in this demo (see roadmap).           ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
class Historian {
  constructor() { this.pts = new Map(); }
  // define: create a point with full attribute set → point
  define(tag, a) {
    const p = Object.assign({ tag, descriptor: '', engunits: '', pointtype: 'Float32', pointsource: 'SIM',
      zero: 0, span: 100, excdev: 0.5, excmax: CFG.HIST.excmax, compdev: 1, compmax: CFG.HIST.compmax, step: 0, compressing: 1 }, a,
      { snap: null, sent: null, prev: null, anchor: null, held: null, sMax: Infinity, sMin: -Infinity, arc: [], raw: [], nRaw: 0, nExc: 0, nArc: 0 });
    this.pts.set(tag, p); return p;
  }
  // drop: delete every point whose tag passes the test
  drop(test) { for (const k of [...this.pts.keys()]) if (test(k)) this.pts.delete(k); }
  // write: new raw value → runs exception test, forwards survivors to compression
  write(tag, t, v) {
    const p = this.pts.get(tag); if (!p || v == null || isNaN(v)) return;
    p.nRaw++; p.raw.push([t, v]); if (p.raw.length > CFG.HIST.rawCap) p.raw.shift();
    p.snap = [t, v];
    if (!p.sent || Math.abs(v - p.sent[1]) > p.excdev || t - p.sent[0] >= p.excmax) {
      if (p.prev) this._comp(p, p.prev);          // PI also sends the value just before the change
      this._comp(p, [t, v]); p.sent = [t, v]; p.prev = null;
    } else p.prev = [t, v];
  }
  // _comp: swinging-door compression of one exception event
  _comp(p, e) {
    p.nExc++;
    if (!p.anchor || !p.compressing) return this._arch(p, e);
    const dt = e[0] - p.anchor[0]; if (dt <= 0) return;
    if (p.step) { if (e[1] !== p.anchor[1] || dt >= p.compmax) this._arch(p, e); return; }
    if (p.held) {
      const s = (e[1] - p.anchor[1]) / dt;
      if (s > p.sMax || s < p.sMin || dt >= p.compmax) this._arch(p, p.held);   // door closed: keep held point
    }
    this._door(p, e); p.held = e;
  }
  // _door: narrow the two "doors" (slope limits) so they still cover event e
  _door(p, e) {
    const dt = e[0] - p.anchor[0]; if (dt <= 0) return;
    p.sMax = Math.min(p.sMax, (e[1] + p.compdev - p.anchor[1]) / dt);
    p.sMin = Math.max(p.sMin, (e[1] - p.compdev - p.anchor[1]) / dt);
  }
  // _arch: store event permanently and restart the doors from it
  _arch(p, e) {
    p.arc.push(e); if (p.arc.length > CFG.HIST.arcCap) p.arc.shift();
    p.anchor = e; p.held = null; p.sMax = Infinity; p.sMin = -Infinity; p.nArc++;
  }
  // series: archived events in [t0,t1] plus one before, plus the live snapshot → [[t,v]]
  series(tag, t0, t1) {
    const p = this.pts.get(tag); if (!p) return [];
    const a = p.arc; let i = a.length; while (i > 0 && a[i - 1][0] >= t0) i--;
    const out = a.slice(Math.max(0, i - 1)).filter(e => e[0] <= t1);
    if (p.snap && p.snap[0] <= t1 && (!out.length || out[out.length - 1][0] < p.snap[0])) out.push(p.snap);
    return out;
  }
  // val: current snapshot value → number|null
  val(tag) { const p = this.pts.get(tag); return p && p.snap ? p.snap[1] : null; }
  // stats: totals across all points → {pts, raw, arc, ratio}
  stats() { let raw = 0, arc = 0; for (const p of this.pts.values()) { raw += p.nRaw; arc += p.nArc; } return { pts: this.pts.size, raw, arc, ratio: arc ? raw / arc : 0 }; }
}

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §4 PID                                                                 ║
   ║ PURPOSE : Standard (ISA "ideal") PID with derivative on PV.            ║
   ║ IN      : SP, PV, dt [s], action 'REV'|'DIR'                           ║
   ║ OUT     : {out, e, P, I, D}  — out clamped 0..100 %                    ║
   ║ NOTES   : OUT = Kc·e + (Kc/Ti)·∫e dt − Kc·Td·dPV/dt.                   ║
   ║           REV (heating): e = SP − PV. DIR (cooling): e = PV − SP.      ║
   ║           Anti-windup: integral is pulled back whenever OUT clips.     ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
class PID {
  constructor(o) { this.kc = o.kc; this.ti = o.ti; this.td = o.td; this.i = 50; this.lastPv = null; }
  // init: bumpless start — choose integral so the next output equals `out`
  init(out, e) { this.i = out - this.kc * e; this.lastPv = null; }
  // exec: one controller execution → {out,e,P,I,D}
  exec(sp, pv, dt, action) {
    const sgn = action === 'REV' ? 1 : -1, e = sgn * (sp - pv);
    const P = this.kc * e;
    const D = this.lastPv == null ? 0 : -sgn * this.kc * this.td * (pv - this.lastPv) / dt;
    if (this.ti > 0) this.i += this.kc * e * dt / this.ti;
    let out = P + this.i + D;
    if (out > 100) { this.i -= out - 100; out = 100; }
    if (out < 0) { this.i -= out; out = 0; }
    this.i = clamp(this.i, -100, 200);
    this.lastPv = pv;
    return { out, e, P, I: this.i, D };
  }
}

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §5 DRIVER (hardware abstraction layer)                                 ║
   ║ PURPOSE : The ONLY door between control code and the physical world.   ║
   ║ CONTRACT: any driver must implement                                    ║
   ║     addVent(n) / removeVent(n)                                         ║
   ║     read(n)  → {tRoom °F, tSup °F, flowPct %, posPct %, online bool}   ║
   ║     write(n, posCmdPct)                                                ║
   ║     step(dt) → advance (sim only; real drivers do nothing)             ║
   ║ NOTES   : SimDriver models duct pressure coupling + room heat balance. ║
   ║           A real NetDriver would speak JSON over WebSocket to the hub: ║
   ║           ← {"n":1,"tRoom":70.2,"tSup":112,"flow":64,"pos":48}         ║
   ║           → {"n":1,"cmd":55}                                           ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
class SimDriver {
  constructor() { this.rooms = new Map(); this.env = { mode: 'HEAT', tOut: 30, staticInwc: 0, totalCfm: 0 }; }
  // addVent: create a simulated room; rooms differ so loops behave differently
  addVent(n) {
    const k = (n - 1) % 3;
    this.rooms.set(n, { T: 67 + k, tDuct: 68, pos: 50, cmd: 50, cfm: 0, UA: [60, 85, 110][k], C: [130, 170, 210][k], gmax: CFG.SIM.FLOW_REF_CFM, stuck: false, dust: 0, offline: false });
  }
  removeVent(n) { this.rooms.delete(n); }
  write(n, cmd) { const r = this.rooms.get(n); if (r && !r.offline) r.cmd = clamp(cmd, 0, 100); }
  // read: sensor values with realistic noise and faults → inputs object
  read(n) {
    const r = this.rooms.get(n), S = CFG.SIM;
    let f = r.cfm / S.FLOW_REF_CFM * 100 * (1 - r.dust / 100);
    f = f < S.STALL ? 0 : f + gauss(0.4);                      // tiny wheel stalls on leakage flow
    return { tRoom: r.T + gauss(0.04), tSup: r.tDuct + gauss(0.2), flowPct: Math.max(0, f), posPct: clamp(r.pos + gauss(0.2), 0, 100), online: !r.offline };
  }
  // step: advance physics by dt seconds
  step(dt) {
    const S = CFG.SIM, E = this.env, run = E.mode !== 'OFF';
    let G = S.G_OTHER;
    for (const r of this.rooms.values()) {
      if (!r.stuck) r.pos += clamp(r.cmd - r.pos, -S.SLEW * dt, S.SLEW * dt);
      r.g = r.gmax * (S.LEAK + (1 - S.LEAK) * Math.pow(r.pos / 100, 1.5));   // damper conductance
      G += r.g;
    }
    // fan curve P = 1 − (Q/Qmax)² with Q = G·√P  ⇒ closed form below
    const P = run ? 1 / (1 + (G * G) / (S.FAN_QMAX * S.FAN_QMAX)) : 0, rootP = Math.sqrt(P);
    E.staticInwc = P * S.INWC; E.totalCfm = G * rootP;
    const Ts = E.mode === 'HEAT' ? S.T_HEAT : S.T_COOL;
    for (const r of this.rooms.values()) {
      r.cfm = r.g * rootP;
      r.tDuct += ((run ? Ts : r.T) - r.tDuct) * dt / S.DUCT_TAU;
      const q = 1.08 * r.cfm * (r.tDuct - r.T) + r.UA * (E.tOut - r.T);      // BTU/h
      r.T += q / r.C * dt / 3600;
    }
  }
}

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §6 LVCS — Local Vent Control System                                    ║
   ║ PURPOSE : Everything that belongs to ONE vent: inputs, PID, modes,     ║
   ║           calibration, identity. Mirrors what the vent's MCU will run. ║
   ║ IN      : driver inputs each scan; SP / MODE / tuning from the HMI.    ║
   ║ OUT     : out (PID demand %), zc (final position command %).           ║
   ║ TAGS    : TIC-1nn.PV/.SP/.OUT/.MODE  ZC-1nn.SP  ZT-1nn.PV  FT-1nn.PV   ║
   ║           TI-1nnS.PV (supply air)                                      ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
class LVCS {
  constructor(c) {
    this.n = c.n; this.loop = 100 + c.n;
    this.name = c.name || 'Vent ' + c.n;
    this.dev = c.dev || `ZL-${randId(4)}-V${String(c.n).padStart(2, '0')}`;   // name the hub looks for
    this.key = c.key || randHex(16);                                           // per-device pre-shared key
    this.mode = c.mode || 'AUTO'; this.sp = c.sp ?? 70; this.man = c.man ?? 50;
    this.pid = new PID(Object.assign({}, CFG.PID, c.pid));
    this.cal = Object.assign({ gain: 1, leak: 0 }, c.cal);
    this.out = 50; this.zc = 50; this.lastW = null; this.ff = 0;
    this.pv = null; this.ft = 0; this.zt = 50; this.tSup = null; this.err = 0;
    this.action = 'REV'; this.air = false; this.online = true; this.stale = 0;
    this.terms = { P: 0, I: 50, D: 0 }; this.cnt = { z: 0, f: 0, t: 0 };
  }
  // tg: build ISA-style tag name → e.g. "TIC-101.PV"
  tg(fn, attr) { return `${fn}-${this.loop}${fn === 'TI' ? 'S' : ''}${attr ? '.' + attr : ''}`; }
  // toJSON: persistable settings only (no live values)
  toJSON() { return { n: this.n, name: this.name, dev: this.dev, key: this.key, mode: this.mode, sp: this.sp, man: this.man, pid: { kc: this.pid.kc, ti: this.pid.ti, td: this.pid.td }, cal: this.cal }; }
  // setMode: AUTO↔MAN with bumpless transfer (no jump in output)
  setMode(m) { if (m === this.mode) return; if (m === 'MAN') this.man = Math.round(this.out); this.mode = m; this.pid.init(this.out, this.err); }
  // compute: read inputs, condition them, run PID → updates this.out
  compute(i, dt) {
    this.online = i.online; if (!i.online) { this.stale++; return; }
    this.stale = 0;
    this.pv = this.pv == null ? i.tRoom : this.pv + CFG.PV_ALPHA * (i.tRoom - this.pv);
    this.tSup = i.tSup; this.zt = i.posPct;
    const d = this.tSup - this.pv; this.air = Math.abs(d) > CFG.AIR_DT;
    let f = clamp(i.flowPct * this.cal.gain, 0, 150);
    if (this.air && f < this.cal.leak) f = this.cal.leak;       // felt-air calibration floor
    this.ft = f;
    const act = d >= 0 ? 'REV' : 'DIR';                          // warm supply ⇒ heating ⇒ reverse acting
    this.err = (act === 'REV' ? 1 : -1) * (this.sp - this.pv);
    if (this.air && act !== this.action) { this.action = act; this.pid.init(this.out, this.err); }
    if (this.mode !== 'AUTO') { this.out = this.man; this.pid.init(this.out, this.err); return; }
    if (!this.air) return;                                       // no airflow ⇒ hold output, no windup
    this.terms = this.pid.exec(this.sp, this.pv, dt, this.action); this.out = this.terms.out;
  }
  // command: send final position to the actuator, honouring the deadband
  command(req, drv) {
    this.zc = req;
    if (this.lastW == null || Math.abs(req - this.lastW) >= CFG.POS_DB || ((req <= 0 || req >= 100) && req !== this.lastW)) { drv.write(this.n, req); this.lastW = req; }
  }
}

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §7 MCS — Main Control System                                           ║
   ║ PURPOSE : Supervises all LVCS: scan order, safety interlock, alarms,   ║
   ║           interaction step test, decoupling feed-forward, historizing. ║
   ║ IN      : driver, vents' settings.                                     ║
   ║ OUT     : position commands; K matrix; alarms[]; historian writes.     ║
   ║ NOTES   : K[i][j] = %flow change at vent j per % position of vent i.   ║
   ║           Learned by startTest(); used when `decouple` is on.          ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
class MCS {
  constructor(drv, hist, t0) {
    this.drv = drv; this.hist = hist; this.t = t0; this.tick_n = 0; this.vents = []; this.nextN = 1;
    this.K = null; this.Kt = null; this.decouple = false; this.test = null; this.alarms = []; this.lift = 0;
    const H = hist, S = { pointsource: 'SIM' };
    H.define('PI-001.PV', { descriptor: 'Supply plenum static pressure', engunits: 'inH2O', zero: 0, span: 1, excdev: 0.003, compdev: 0.006, ...S });
    H.define('FI-001.PV', { descriptor: 'Total system airflow', engunits: 'CFM', zero: 0, span: 1500, excdev: 4, compdev: 8, ...S });
    H.define('TI-001.PV', { descriptor: 'Outdoor air temperature', engunits: 'degF', zero: -20, span: 140, excdev: 0.2, compdev: 0.4, ...S });
    H.define('HS-001.PV', { descriptor: 'HVAC mode 0=OFF 1=HEAT 2=COOL', engunits: 'state', pointtype: 'Digital', zero: 0, span: 2, excdev: 0, compdev: 0, step: 1, ...S });
    H.define('UA-001.PV', { descriptor: 'Min-airflow interlock lift', engunits: '%', zero: 0, span: 100, excdev: 0.5, compdev: 1, pointsource: 'MCS' });
  }
  // vent: look up by number → LVCS|undefined
  vent(n) { return this.vents.find(v => v.n === n); }
  // addVent: create LVCS + sim room + historian points → LVCS
  addVent(c = {}) {
    const n = c.n || this.nextN; this.nextN = Math.max(this.nextN, n + 1);
    const v = new LVCS(Object.assign({}, c, { n })); this.vents.push(v); this.drv.addVent(n);
    const H = this.hist, L = { pointsource: 'LVCS' }, nm = v.name;
    H.define(v.tg('TIC', 'PV'), { descriptor: nm + ' room temperature', engunits: 'degF', zero: 50, span: 50, excdev: 0.1, compdev: 0.2, ...L });
    H.define(v.tg('TIC', 'SP'), { descriptor: nm + ' temperature setpoint', engunits: 'degF', zero: 50, span: 50, excdev: 0, compdev: 0, step: 1, pointsource: 'HMI' });
    H.define(v.tg('TIC', 'OUT'), { descriptor: nm + ' controller output (damper demand)', engunits: '%', ...L });
    H.define(v.tg('TIC', 'MODE'), { descriptor: nm + ' mode 0=MAN 1=AUTO', engunits: 'state', pointtype: 'Digital', zero: 0, span: 1, excdev: 0, compdev: 0, step: 1, pointsource: 'HMI' });
    H.define(v.tg('ZC', 'SP'), { descriptor: nm + ' final position command', engunits: '%', pointsource: 'MCS' });
    H.define(v.tg('ZT', 'PV'), { descriptor: nm + ' damper position feedback', engunits: '%', ...L });
    H.define(v.tg('FT', 'PV'), { descriptor: nm + ' airflow (of full flow)', engunits: '%', zero: 0, span: 150, ...L });
    H.define(v.tg('TI', 'PV'), { descriptor: nm + ' supply air temperature', engunits: 'degF', zero: 40, span: 100, excdev: 0.5, compdev: 1, ...L });
    return v;
  }
  // removeVent: delete LVCS, room, points and learned gains
  removeVent(n) {
    const v = this.vent(n); if (!v) return;
    if (this.test) this.abortTest();
    this.vents = this.vents.filter(x => x !== v); this.drv.removeVent(n);
    this.hist.drop(k => k.includes('-' + v.loop + '.') || k.includes('-' + v.loop + 'S.'));
    if (this.K) { delete this.K[n]; for (const r of Object.values(this.K)) delete r[n]; }
  }
  // tick: advance one simulated second; run a control scan every SCAN_S
  tick() { this.drv.step(1); this.t += 1; if (++this.tick_n % CFG.SCAN_S === 0) this.scan(); }
  // scan: one full control cycle for the whole house
  scan() {
    const V = this.vents, dt = CFG.SCAN_S, t = this.t, H = this.hist, E = this.drv.env;
    for (const v of V) v.compute(this.drv.read(v.n), dt);
    if (this.test) this._testStep();
    // decoupling feed-forward: cancel the flow change neighbours cause at this vent
    for (const v of V) {
      let ff = 0; const kjj = this.K && this.K[v.n] && this.K[v.n][v.n];
      if (this.decouple && !this.test && v.mode === 'AUTO' && kjj > 0.05)
        for (const o of V) if (o !== v && this.K[o.n]) ff -= (this.K[o.n][v.n] || 0) * (o.zt - CFG.TEST.base) / kjj;
      v.ff += 0.2 * (clamp(ff, -CFG.FF_MAX, CFG.FF_MAX) - v.ff);
    }
    const req = V.map(v => clamp(v.out + v.ff, 0, 100));
    // SAFETY: keep enough total opening so the blower never dead-heads (bypassed only during the short step test)
    this.lift = 0;
    if (!this.test && V.length) for (let k = 0; k < 4; k++) {
      const avg = req.reduce((a, b) => a + b, 0) / req.length, need = CFG.MIN_AVG_OPEN - avg;
      if (need <= 0.01) break;
      this.lift += need; for (let i = 0; i < req.length; i++) req[i] = Math.min(100, req[i] + need);
    }
    V.forEach((v, i) => { if (v.online) v.command(req[i], this.drv); });
    // historize every tag every scan; the historian decides what is worth keeping
    for (const v of V) if (v.online) {
      H.write(v.tg('TIC', 'PV'), t, v.pv); H.write(v.tg('TIC', 'SP'), t, v.sp); H.write(v.tg('TIC', 'OUT'), t, v.out);
      H.write(v.tg('TIC', 'MODE'), t, v.mode === 'AUTO' ? 1 : 0); H.write(v.tg('ZC', 'SP'), t, v.zc);
      H.write(v.tg('ZT', 'PV'), t, v.zt); H.write(v.tg('FT', 'PV'), t, v.ft); H.write(v.tg('TI', 'PV'), t, v.tSup);
    }
    H.write('PI-001.PV', t, E.staticInwc); H.write('FI-001.PV', t, E.totalCfm); H.write('TI-001.PV', t, E.tOut);
    H.write('HS-001.PV', t, { OFF: 0, HEAT: 1, COOL: 2 }[E.mode]); H.write('UA-001.PV', t, this.lift);
    this._alarms();
  }
  // _alarms: rebuild the active alarm list
  _alarms() {
    const A = [], L = CFG.ALM, E = this.drv.env;
    for (const v of this.vents) {
      if (v.stale >= L.comm) { A.push({ tag: v.tg('TIC'), pri: 1, msg: `${v.name}: no data from LVCS (comm loss)` }); continue; }
      v.cnt.z = Math.abs((v.lastW ?? v.zt) - v.zt) > L.zdev ? v.cnt.z + 1 : 0;
      v.cnt.f = v.air && v.zt > 60 && v.ft < L.flowLo ? v.cnt.f + 1 : 0;
      v.cnt.t = v.mode === 'AUTO' && v.air && Math.abs(v.sp - v.pv) > L.tDev ? v.cnt.t + 1 : 0;
      if (v.cnt.z >= L.zScans) A.push({ tag: v.tg('ZT'), pri: 1, msg: `${v.name}: position ≠ command — actuator stuck or linkage slipped` });
      if (v.cnt.f >= L.fScans) A.push({ tag: v.tg('FT'), pri: 2, msg: `${v.name}: low flow while open — clean flow sensor / check duct` });
      if (v.cnt.t >= L.tScans) A.push({ tag: v.tg('TIC'), pri: 3, msg: `${v.name}: temperature off setpoint > ${L.tDev}°F for 30 min` });
    }
    if (E.staticInwc > CFG.PAH_INWC) A.push({ tag: 'PI-001', pri: 1, msg: 'Static pressure high — too many vents closed' });
    if (this.lift > 0.5) A.push({ tag: 'UA-001', pri: 3, msg: `Min-airflow interlock active (+${fx(this.lift, 0)}% on all vents)` });
    this.alarms = A.sort((a, b) => a.pri - b.pri);
  }
  // startTest: begin interaction step test → error text or ''
  startTest() {
    if (this.test) return 'Test already running';
    if (!this.vents.length) return 'Add a vent first';
    if (!this.vents.some(v => v.air)) return 'HVAC must be blowing warm or cold air to run the test';
    const T = CFG.TEST, steps = [{ all: T.base, n: T.settleAll, msg: `All vents → ${T.base}%` }];
    for (const v of this.vents) {
      for (let c = 1; c <= 2; c++) steps.push({ v: v.n, to: 100, n: T.settle, rec: 'hi', msg: `${v.name} → 100% (cycle ${c})` }, { v: v.n, to: 0, n: T.settle, rec: 'lo', msg: `${v.name} → 0% (cycle ${c})` });
      steps.push({ v: v.n, to: T.base, n: T.back, msg: `${v.name} → back to ${T.base}%` });
    }
    this.test = { steps, i: 0, k: 0, rec: {}, acc: {}, m: 0, total: steps.reduce((a, s) => a + s.n, 0), done: 0, saved: this.vents.map(v => [v.n, v.mode, v.man]) };
    this.vents.forEach(v => v.setMode('MAN'));
    return '';
  }
  // _testStep: advance the test state machine by one scan
  _testStep() {
    const T = this.test, s = T.steps[T.i], V = this.vents;
    if (T.k === 0) { if (s.all != null) V.forEach(v => v.man = s.all); else this.vent(s.v).man = s.to; T.acc = {}; T.m = 0; }
    T.k++; T.done++;
    if (s.rec && T.k > s.n - CFG.TEST.avg) { for (const v of V) T.acc[v.n] = (T.acc[v.n] || 0) + v.ft; T.m++; }
    V.forEach(v => v.out = v.man);
    if (T.k < s.n) return;
    if (s.rec) { const r = T.rec[s.v] = T.rec[s.v] || { hi: [], lo: [] }; r[s.rec].push(Object.fromEntries(V.map(v => [v.n, T.acc[v.n] / T.m]))); }
    T.i++; T.k = 0; if (T.i >= T.steps.length) this._finishTest();
  }
  // _finishTest: turn recorded flows into the K gain matrix, restore modes
  _finishTest() {
    const T = this.test, K = {};
    for (const [i, r] of Object.entries(T.rec)) {
      K[i] = {};
      for (const v of this.vents) { let s = 0; r.hi.forEach((h, c) => s += h[v.n] - r.lo[c][v.n]); K[i][v.n] = s / r.hi.length / 100; }
    }
    this.K = K; this.Kt = this.t; this.abortTest();
  }
  // abortTest: stop the test and give loops back their modes
  abortTest() { const T = this.test; if (!T) return; this.test = null; for (const [n, m, man] of T.saved) { const v = this.vent(n); if (v) { v.man = man; v.setMode(m); } } }
  // config: everything worth saving → plain object
  config() { return { app: CFG.APP, ver: CFG.VER, vents: this.vents.map(v => v.toJSON()), K: this.K, decouple: this.decouple, env: { mode: this.drv.env.mode, tOut: this.drv.env.tOut } }; }
}

   ╚════════════════════════════════════════════════════════════════════════╝ */
let sim, hist, mcs;
// buildCore: create fresh driver + historian + MCS from an optional saved config
function buildCore(cfg) {
  sim = new SimDriver(); hist = new Historian(); mcs = new MCS(sim, hist, Math.floor(Date.now() / 1000));
  const vs = cfg && cfg.vents && cfg.vents.length ? cfg.vents : [{ name: 'Living Room', sp: 70 }, { name: 'Bedroom', sp: 68 }, { name: 'Office', sp: 71 }];
  vs.forEach(c => mcs.addVent(c));
  if (cfg) { mcs.K = cfg.K || null; mcs.decouple = !!cfg.decouple; if (cfg.env) Object.assign(sim.env, cfg.env); }
}
if (typeof module !== 'undefined') module.exports = { CFG, Historian, PID, SimDriver, LVCS, MCS, buildCore, get mcs() { return mcs; }, get hist() { return hist; }, get sim() { return sim; }, TERMS, F };

// drawTrend: plot series on a canvas; left axis auto, right axis 0–100 %
function drawTrend(cv, series, t0, t1) {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  const dpr = window.devicePixelRatio || 1; cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const L = 38, R = series.some(s => s.axis === 'r') ? 30 : 6, T = 8, B = 18, pw = w - L - R, ph = h - T - B;
  let lo = Infinity, hi = -Infinity;
  for (const s of series) if (s.axis !== 'r') for (const p of s.pts) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
  if (!isFinite(lo)) { lo = 0; hi = 1; } const pad = Math.max((hi - lo) * 0.12, 0.25); lo -= pad; hi += pad;
  const X = t => L + (t - t0) / (t1 - t0) * pw, Y = (v, ax) => ax === 'r' ? T + ph - v / 100 * ph : T + ph - (v - lo) / (hi - lo) * ph;
  g.font = '10px system-ui'; g.fillStyle = cssv('--mut'); g.strokeStyle = cssv('--line'); g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = T + ph * i / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.textAlign = 'right'; g.fillText((hi - (hi - lo) * i / 4).toFixed(1), L - 4, y + 3); if (R > 10) { g.textAlign = 'left'; g.fillText(100 - 25 * i + '%', L + pw + 3, y + 3); } }
  g.textAlign = 'left'; g.fillText(hhmm(t0), L, h - 4); g.textAlign = 'right'; g.fillText(hhmm(t1), L + pw, h - 4);
  g.save(); g.beginPath(); g.rect(L, T, pw, ph); g.clip();
  for (const s of series) {
    if (!s.pts.length) continue; g.strokeStyle = g.fillStyle = s.color; g.lineWidth = s.width || 1.6; g.globalAlpha = s.alpha || 1;
    g.beginPath(); let py = null;
    s.pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1], s.axis); if (!i) g.moveTo(x, y); else { if (s.step) g.lineTo(x, py); g.lineTo(x, y); } py = y; });
    if (s.step) g.lineTo(X(t1), py);
    g.stroke();
    if (s.dots) for (const p of s.pts) { g.beginPath(); g.arc(X(p[0]), Y(p[1], s.axis), 2.6, 0, 7); g.fill(); }
  }
  g.restore(); g.globalAlpha = 1;
}

    <h3>Identity &amp; pairing</h3><label class="f">Name <input type="text" data-in="vset" data-id="${v.n}" data-p="name" value="${esc(v.name)}"></label>
    <label class="f">Device name (hub looks for this) <code>${v.dev}</code></label><label class="f">${ac('PSK', 'Key')} <code class="small">${v.key}</code></label><button data-act="regen" data-id="${v.n}">New name + key</button>
    <h3>Calibration</h3><label class="f">${ac('FT')} gain (after cleaning / vs handheld) ${num('gain', v.cal.gain, 0.05)}</label>
    <p class="small"><b>Felt-air check</b> — vent closed, blower on, sensor reads 0. How much air do you feel?</p>
    <div class="row" style="justify-content:flex-start">${[['None', 0], ['Faint', 4], ['Light', 8], ['Moderate', 15]].map(([l, x]) => `<button data-act="leak" data-id="${v.n}" data-x="${x}">${l}</button>`).join('')}<label>or handheld % ${num('leak', v.cal.leak, 1)}</label></div>
    <h3>Simulated faults</h3><label class="f">Actuator stuck <input type="checkbox" data-in="vset" data-id="${v.n}" data-p="stuck" ${r.stuck ? 'checked' : ''}></label><label class="f">Flow sensor dust, % blocked ${num('dust', r.dust, 5)}</label><label class="f">Radio offline <input type="checkbox" data-in="vset" data-id="${v.n}" data-p="offline" ${r.offline ? 'checked' : ''}></label>
    <p><button class="warn" data-act="delvent" data-id="${v.n}">Remove this vent</button></p>`;
  } else if (S.kind === 'pt') {
    const p = hist.pts.get(S.tag), ed = k => `<input type="number" step="any" data-in="pt" data-tag="${p.tag}" data-p="${k}" value="${p[k]}">`;
    h = `${close}<h2 class="tag" style="font-size:15px">${p.tag}</h2><p class="small">${esc(p.descriptor)}</p>
    <div class="row"><span class="small mut">Window</span>${win}</div><canvas id="ptrend"></canvas>${legend([['--mut', 'raw scans'], ['--acc', 'archived events (dots)']])}<p class="small" id="ptstat"></p>
    <h3>Point attributes</h3><table><tbody>
    <tr><td>${ac('EngUnits')}</td><td>${p.engunits}</td><td>PointType</td><td>${p.pointtype}</td></tr><tr><td>${ac('PointSource')}</td><td>${p.pointsource}</td><td>${ac('Step')}</td><td>${p.step}</td></tr>
    <tr><td>${ac('Zero/Span', 'Zero')}</td><td>${p.zero}</td><td>${ac('Zero/Span', 'Span')}</td><td>${p.span}</td></tr>
    <tr><td>${ac('ExcDev')}</td><td>${ed('excdev')}</td><td>${ac('ExcMax')} s</td><td>${ed('excmax')}</td></tr><tr><td>${ac('CompDev')}</td><td>${ed('compdev')}</td><td>${ac('CompMax')} s</td><td>${ed('compmax')}</td></tr></tbody></table>
    <p class="small mut">Try CompDev = 0 and watch the archive count climb, then raise it and watch dots thin out.</p>
    <button data-act="csv" data-tag="${p.tag}">Archive → CSV</button><textarea id="csvbox" hidden></textarea>`;
  } else if (S.kind === 'term') {
    const t = TERMS.find(x => x[0] === S.k), v = exVent(); if (!t) return;
    h = `${close}<h2>${esc(t[0])} <span class="small mut">${t[2]}</span></h2><p><b>${esc(t[1])}</b></p>${F[t[4]] ? F[t[4]](v) : ''}<p>${esc(t[3])}</p>
    ${t[6] && v ? `<div class="note"><b>In this system, right now:</b> ${esc(t[6](v))}</div>` : ''}
    ${t[5] && t[5].length ? `<p class="small">Related: ${t[5].map(k => ac(k)).join(' · ')}</p>` : ''}`;

// closeSheet: hide modal
function closeSheet() { UI.sheet = null; $('#sheet').hidden = true; }
// show: switch tab and rebuild its HTML
function show(tab) { UI.tab = tab || UI.tab; $('#main').innerHTML = R[UI.tab](); document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab)); U[UI.tab](); }
// header: refresh top bar chips
function header() {
  $('#hClock').textContent = hhmm(mcs.t, 1) + ' · ' + UI.speed + '×';
  const E = sim.env; $('#hHvac').textContent = 'HVAC ' + E.mode;
  const n = mcs.alarms.filter(a => a.pri < 3).length, a = $('#hAlm'); a.textContent = n + (n === 1 ? ' alarm' : ' alarms'); a.className = 'chip ' + (n ? 'bad' : 'ok');
  $('#hRun').textContent = UI.run ? '⏸' : '▶';
}

/* ── §10.4 EVENTS (one click listener, one input listener) ────────────── */
const ACT = {
  tab: a => show(a.dataset.t), run: () => { UI.run = !UI.run; header(); }, close: closeSheet,
  term: a => openSheet({ kind: 'term', k: a.dataset.k }), cat: a => { UI.cat = a.dataset.c; show(); },
  mode: a => { const v = mcs.vent(+a.dataset.id); if (mcs.test) return alert('Interaction test is running.'); v.setMode(v.mode === 'AUTO' ? 'MAN' : 'AUTO'); U.vents(); },
  sp: a => { const v = mcs.vent(+a.dataset.id); v.sp = clamp(v.sp + +a.dataset.d, 55, 85); UI.lastVent = v.n; U.vents(); },
  detail: a => openSheet({ kind: 'vent', n: +a.dataset.id }), pt: a => openSheet({ kind: 'pt', tag: a.dataset.tag }),
  addvent: () => { mcs.addVent({}); save(); show(); },
  delvent: a => { if (confirm('Remove this vent and its tags?')) { mcs.removeVent(+a.dataset.id); closeSheet(); save(); show(); } },
  regen: a => { const v = mcs.vent(+a.dataset.id); v.dev = `ZL-${randId(4)}-V${String(v.n).padStart(2, '0')}`; v.key = randHex(16); save(); openSheet(UI.sheet); },
  leak: a => { const v = mcs.vent(+a.dataset.id); v.cal.leak = +a.dataset.x; save(); openSheet(UI.sheet); },
  test: () => { const e = mcs.startTest(); if (e) alert(e); U.system(); }, testabort: () => mcs.abortTest(),
  cfgexp: () => { $('#cfgbox').value = JSON.stringify(mcs.config(), null, 1); },
  cfgimp: () => { try { const c = JSON.parse($('#cfgbox').value); if (!c.vents) throw 0; buildCore(c); save(); show(); } catch (e) { alert('That is not a valid ZoneLoop config.'); } },
  reset: () => { if (confirm('Erase all settings and start over?')) { buildCore(null); save(); show(); } },
  csv: a => { const p = hist.pts.get(a.dataset.tag), b = $('#csvbox'); b.hidden = false; b.value = 'tag,timestamp,value,engunits\n' + p.arc.map(e => `${p.tag},${new Date(e[0] * 1000).toISOString()},${+e[1].toFixed(4)},${p.engunits}`).join('\n'); b.select(); },
};
const IN = {
  man: el => { const v = mcs.vent(+el.dataset.id); v.man = +el.value; },
  speed: el => { UI.speed = +el.value; }, win: el => { UI.win = +el.value; U.sheet(); },
  hmode: el => { sim.env.mode = el.value; if (el.value === 'COOL' && sim.env.tOut < 75) sim.env.tOut = 92; if (el.value === 'HEAT' && sim.env.tOut > 60) sim.env.tOut = 30; save(); show(); },
  tout: el => { sim.env.tOut = clamp(+el.value || 0, -20, 120); save(); },
  decouple: el => { mcs.decouple = el.checked; save(); },
  q: el => { UI.q = el.value; show(); const i = $('[data-in="q"]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); },
  hq: el => { UI.hq = el.value; U.hist(); },
  pt: el => { const p = hist.pts.get(el.dataset.tag), x = +el.value; if (p && x >= 0) p[el.dataset.p] = x; },
  vset: el => {
    const v = mcs.vent(+el.dataset.id), r = sim.rooms.get(v.n), p = el.dataset.p, x = +el.value;
    if (p === 'name') { v.name = el.value.slice(0, 24) || v.name; for (const pt of hist.pts.values()) if (pt.tag.includes('-' + v.loop)) pt.descriptor = pt.descriptor.replace(/^.*? (room|temperature|controller|mode|final|damper|airflow|supply)/, v.name + ' $1'); }
    else if (p === 'kc') v.pid.kc = clamp(x, 0, 200); else if (p === 'ti') v.pid.ti = clamp(x, 0, 36000); else if (p === 'td') v.pid.td = clamp(x, 0, 3600);
    else if (p === 'gain') v.cal.gain = clamp(x || 1, 0.2, 5); else if (p === 'leak') v.cal.leak = clamp(x, 0, 40);
    else if (p === 'stuck') r.stuck = el.checked; else if (p === 'offline') r.offline = el.checked; else if (p === 'dust') r.dust = clamp(x, 0, 100);
    save();
  },
};

/* ╔════════════════════════════════════════════════════════════════════════╗
   ║ §11 BOOT                                                               ║
   ║ PURPOSE : Load saved config, wire events, run the main timer.          ║
   ║ NOTES   : Storage may be blocked in sandboxed previews — failures are  ║
   ║           swallowed and the app simply starts with defaults.           ║
   ╚════════════════════════════════════════════════════════════════════════╝ */
// save: persist settings (best effort)
function save() { try { localStorage.setItem(CFG.STORE_KEY, JSON.stringify(mcs.config())); } catch (e) { /* storage unavailable */ } }
// load: read saved settings → object|null
function load() { try { return JSON.parse(localStorage.getItem(CFG.STORE_KEY)); } catch (e) { return null; } }
// loop: 4 Hz wall-clock timer → advances sim time by speed, then refreshes UI
function loop() {
  if (UI.run) { UI.acc += 0.25 * UI.speed; const n = Math.floor(UI.acc); UI.acc -= n; for (let i = 0; i < n; i++) mcs.tick(); }
  header(); U[UI.tab](); U.sheet();
}
if (typeof document !== 'undefined') {
  buildCore(load());
  for (let i = 0; i < 600; i++) mcs.tick();            // pre-roll 10 sim-minutes so trends are not empty
  $('#ver').textContent = 'v' + CFG.VER + ' · demo';
  document.addEventListener('click', e => { if (e.target.id === 'sheet') return closeSheet(); const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e); });
  document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k] && (e.target.type === 'range' || e.target.type === 'search')) IN[k](e.target); });
  document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k] && e.target.type !== 'range' && e.target.type !== 'search') IN[k](e.target); });
  show('vents'); setInterval(loop, 250); setInterval(save, 15000);
}
